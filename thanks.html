<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — YIELD MAX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { background: white; border-radius: 16px; padding: 60px 48px; text-align: center; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .icon { font-size: 56px; margin-bottom: 24px; }
    h1 { font-size: 28px; color: #1A4D2E; margin-bottom: 16px; }
    p { color: #555; font-size: 16px; line-height: 1.6; margin-bottom: 32px; }
    a { display: inline-block; background: #1A4D2E; color: white; padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: 700; }
    a:hover { background: #2d6e47; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>Thank You!</h1>
    <p>Your enquiry has been received. We'll get back to you within 24 hours.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
